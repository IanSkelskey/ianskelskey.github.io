    <!-- Social + SEO metadata. og:image and og:url must be absolute URLs. -->

    <!-- Open Graph (Facebook, LinkedIn, Discord, etc.) -->

      property="og:description"
      content="Small applications and reusable templates you can explore, try, and build on."

    />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ian Skelskey / Demos" />

      name="twitter:description"
      content="Small applications and reusable templates you can explore, try, and build on."

    <!-- <meta name="twitter:site" content="@yourhandle" /> -->
    <!-- Preconnect to external origins (fonts, API hosts) as needed -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com" /> -->
    <!--
      GitHub Pages SPA: restore path encoded by 404.html before React boots.
      Inlined (rather than external) so it is not a render-blocking request
      and runs synchronously before the router reads window.location.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded[0] + (decoded[1] ? "?" + decoded[1] : "") + l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
