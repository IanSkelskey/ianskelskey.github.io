name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild so asset packs published on itch.io appear without a push.
  schedule:
    - cron: "0 6 * * 1"

# Allow one concurrent deployment; skip runs in progress but queue the latest.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Overwrites the committed asset pack snapshot with live itch.io data.
      # Warns and keeps the snapshot if the secret is missing or itch.io is down.
      - name: Refresh itch.io asset packs
        env:
          ITCH_IO_API_KEY: ${{ secrets.ITCH_IO_API_KEY }}
        run: npm run itch:refresh
      # This user site is served at the domain root, not under the repo name.
      - name: Build
        env:
          BASE_PATH: /
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
